name: Testes Python e cobertura

on:
  push:
    branches:
      - main
      - fase-6-relatorios-backup
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/verify_coverage.py"
      - "pyproject.toml"
      - ".github/workflows/testes-python.yml"
  pull_request:
    branches:
      - main
      - fase-6-relatorios-backup
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/verify_coverage.py"
      - "pyproject.toml"
      - ".github/workflows/testes-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-coverage:
    name: Suíte Python e metas RNF03
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"
      - name: Executar testes e verificar cobertura
        run: pytest && python scripts/verify_coverage.py
